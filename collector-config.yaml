receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  # Weaver's gRPC OTLP receiver does not support compressed payloads —
  # send uncompressed. Target weaver's static IP (docker-compose.yml) directly:
  # the backend restarts the weaver container per session and gRPC would
  # otherwise keep dialing the first IP it resolved for `weaver`.
  otlp_grpc:
    endpoint: 172.28.71.10:4317
    compression: none
    tls:
      insecure: true
    # Weaver comes and goes per session; keep reconnecting quickly and hold
    # queued telemetry until it is back rather than dropping it.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 0
    sending_queue:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # Expose the collector's own metrics on an in-network Prometheus endpoint.
  # The backend scrapes http://collector:8888/metrics for live signal counts
  # (otelcol_receiver_accepted_spans / _metric_points / _log_records) during a
  # listening session. Not published to the host — additive, no port change.
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlp]
      exporters: [otlp_grpc]
