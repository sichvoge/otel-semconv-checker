# Serves the built SPA and reverse-proxies the API so the browser talks to a
# single origin. `backend` resolves on the compose network.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API — forward to the backend container. No buffering and a long read
  # timeout: POST /api/session/start blocks ~10-25s (weaver boot + collector
  # restart) and POST /api/session/stop blocks while the report flushes.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
